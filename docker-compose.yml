# Chinese reader behind a reverse proxy that keeps the /chinese prefix.
# Copy .env.example to .env and fill in the secrets before starting.
# The align service is on the compose network only. It is not published.
services:
  align:
    build:
      context: .
      dockerfile: align/Dockerfile
    image: chinese-reader-align
    restart: unless-stopped
    environment:
      TORCH_HOME: /models
      ALIGN_PORT: "8000"
    expose:
      - "8000"
    volumes:
      - align-models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  chinese-reader:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/chinese}
    image: chinese-reader
    restart: unless-stopped
    depends_on:
      - align
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3010}
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data
      BASE_PATH: ${BASE_PATH:-/chinese}
      ALIGN_URL: http://align:8000
    ports:
      - "${HOST_PORT:-3010}:${PORT:-3010}"
    volumes:
      - reader-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||'3010'; const b=process.env.BASE_PATH||''; fetch('http://127.0.0.1:'+p+b+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  reader-data:
  align-models:
